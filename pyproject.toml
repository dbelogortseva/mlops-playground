[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mlops-playground"
version = "0.1.0"
description = "Daily order forecasting and feature preparation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "joblib",
    "numpy",
    "pandas",
    "pyarrow",
    "pydantic>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "scikit-learn",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["httpx", "pytest"]
notebook = [
    "ipykernel",
    "matplotlib",
    "pyarrow",
    "scipy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_playground"]
