name: ci
on:
  push: {branches: [main]}
  pull_reqiest:

jobs:
  tests:
    runs-on: ubuntu-latests
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@7
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest