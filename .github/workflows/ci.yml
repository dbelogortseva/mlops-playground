name: ci
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: mlops}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: "postgresql://postgres:test@localhost:5432/mlops"

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  build:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, kind]
    concurrency: {group: deploy-kind}
    timeout-minutes: 10
    permissions: {contents: read, packages: read}
    env:
      KIND_CLUSTER: mlops-playground

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: kind, kubectl и доступ к кластеру
        run: |
          B="$HOME/.local/bin" && mkdir -p "$B" && echo "$B" >> "$GITHUB_PATH"
          [ -x "$B/kind" ] || curl -sSL -o "$B/kind" https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          [ -x "$B/kubectl" ] || curl -sSL -o "$B/kubectl" https://dl.k8s.io/v1.37.0/bin/linux/amd64/kubectl
          chmod +x "$B/kind" "$B/kubectl"
          "$B/kind" export kubeconfig --name "$KIND_CLUSTER" --internal
          "$B/kubectl" get nodes
      - name: образ в кластер
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name "$KIND_CLUSTER"
      - name: подтягиваем секреты
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          test -n "$DB_PASSWORD"
          DATABASE_URL=$(python3 -c 'import os,urllib.parse; print("postgresql://postgres:" + urllib.parse.quote(os.environ["DB_PASSWORD"], safe="") + "@postgres:5432/mlops")')
          kubectl create secret generic mlops-secrets \
            --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: база
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deployment/postgres --timeout=180s
      - name: сервис
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/mlops-api api="$IMAGE"
          kubectl rollout status deployment/mlops-api --timeout=180s
      - name: smoke
        run: |
          kubectl port-forward service/mlops-api 8080:80 >/tmp/mlops-port-forward.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:8080/health | tee health.json
          python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["model_path"] == "artifact/model.joblib", r' < health.json

          curl --fail --silent --show-error -X POST http://127.0.0.1:8080/v1/predict \
            -H "Content-Type: application/json" -d @good.json \
            | tee pred.json \
            | python3 -c 'import json,math,sys; r=json.load(sys.stdin); assert math.isfinite(r["prediction"]) and 0 <= r["prediction"], r'

          sleep 2
          RID=$(python3 -c 'import json; print(json.load(open("pred.json"))["request_id"])')
          POD=$(kubectl get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          kubectl exec "$POD" -- psql -U postgres -d mlops \
            -tAc "SELECT count(*) FROM predictions WHERE request_id = '$RID' AND status_code = 200" \
            | grep -qx 1
      - name: диагностика
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get services -A
          kubectl describe deployment/mlops-api | tail -20
          kubectl logs deployment/mlops-api --tail=50 || true
          kubectl logs deployment/postgres --tail=50 || true
