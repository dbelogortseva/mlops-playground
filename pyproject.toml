[project]
name = "mlops-playground"
version = "1.0.0"
description = "Daily order prediction service"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pandas",
    "numpy",
    "scikit-learn>=1.6,<1.7",
    "joblib",
    "psycopg[binary]",
    "mlflow-skinny==3.16.1",
    "skops>=0.16,<0.17",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "ipykernel",
    "pyarrow",
]
train = [
    "matplotlib>=3.11.2",
    "mlflow==3.16.1",
    "pyarrow>=25.0.1",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mlops_playground"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL at DATABASE_URL"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
