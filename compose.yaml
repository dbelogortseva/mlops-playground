services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: mlops
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - prediction_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops -d mlops"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  prediction_db:
