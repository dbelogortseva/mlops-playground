services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://mlops:mlops_local@db:5432/mlops
      MODEL_PATH: /app/artifact/model.joblib
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: mlops
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - prediction_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops -d mlops"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  prediction_db:
